<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Μια συλλογή διαδραστικών εφαρμογών">
<title>Οι Εφαρμογές μου</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

:root {
  --φόντο: #FAFAFA;
  --καρτέλα: #FFFFFF;
  --accent: #2D7DD2;
  --σύνδεσμος: #1F67B5;
  --κείμενο: #1A1A1A;
  --δευτερεύον: #555555;
  --hover: #F0F7FF;
  --περίγραμμα: #E8E8E8;
  --μετάβαση: 200ms;
}

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--φόντο);
  color: var(--κείμενο);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.5;
}

.περιέκτης {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

.οπτικά-κρυφό {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- Header ---------- */
.κεφαλίδα {
  position: relative;
  text-align: center;
  padding: 3rem 0 2rem;
}
.κεφαλίδα h1 {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
  margin: 0;
}
.υπότιτλος {
  font-size: 1rem;
  font-weight: 400;
  color: var(--δευτερεύον);
  margin: 0.5rem 0 0;
}
.github-σύνδεσμος {
  position: absolute;
  top: 1rem;
  right: 0;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.3rem 0.65rem;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--δευτερεύον);
  text-decoration: none;
  border: 1px solid var(--περίγραμμα);
  border-radius: 999px;
  background: var(--καρτέλα);
  transition: color var(--μετάβαση) ease, border-color var(--μετάβαση) ease;
}
.github-σύνδεσμος:hover { color: var(--σύνδεσμος); border-color: var(--accent); }
.github-σύνδεσμος svg { width: 14px; height: 14px; }

/* ---------- Αναζήτηση ---------- */
.αναζήτηση-περιέκτης {
  display: flex;
  justify-content: center;
  margin-bottom: 2rem;
}
#αναζήτηση {
  width: 100%;
  max-width: 400px;
  padding: 0.6rem 1rem;
  font: inherit;
  color: var(--κείμενο);
  background: var(--καρτέλα);
  border: 1.5px solid #DDDDDD;
  border-radius: 8px;
  transition: border-color var(--μετάβαση) ease, box-shadow var(--μετάβαση) ease;
}
#αναζήτηση::placeholder { color: #767676; opacity: 1; }
#αναζήτηση:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(45,125,210,0.15);
}

/* ---------- Grid καρτελών ---------- */
.πλέγμα {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.25rem;
  margin: 0;
  padding: 0;
}
@media (min-width: 768px) {
  .πλέγμα { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 1024px) {
  .πλέγμα { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

.καρτέλα {
  display: flex;
  min-height: 160px;
  background: var(--καρτέλα);
  border: 1px solid var(--περίγραμμα);
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition:
    transform var(--μετάβαση) ease,
    box-shadow var(--μετάβαση) ease,
    background-color var(--μετάβαση) ease;
}
.καρτέλα > .περιεχόμενο-καρτέλας {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 100%;
  padding: 1.5rem;
  color: inherit;
  text-decoration: none;
  border-radius: inherit;
}
.καρτέλα:not(.απενεργοποιημένη):hover,
.καρτέλα:not(.απενεργοποιημένη):focus-within {
  transform: translateY(-4px);
  background-color: var(--hover);
  /* Η μπλε γραμμή αριστερά ως inset σκιά, ώστε να μη μετακινείται το περιεχόμενο. */
  box-shadow: inset 3px 0 0 var(--accent), 0 8px 20px rgba(0,0,0,0.10);
}
a.περιεχόμενο-καρτέλας:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.εικονίδιο {
  display: block;
  font-size: 2.5rem;
  line-height: 1;
  margin-bottom: 0.75rem;
}
.τίτλος-καρτέλας {
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.3;
  color: var(--κείμενο);
  margin: 0 0 0.35rem;
}
.περιγραφή-καρτέλας {
  font-size: 0.875rem;
  line-height: 1.5;
  color: var(--δευτερεύον);
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.απενεργοποιημένη { opacity: 0.5; cursor: default; }
.σήμανση-μη-διαθέσιμης {
  margin-top: 0.6rem;
  font-size: 0.75rem;
  color: var(--δευτερεύον);
  border: 1px solid var(--περίγραμμα);
  border-radius: 999px;
  padding: 0.1rem 0.55rem;
}

.μήνυμα-κενού {
  text-align: center;
  color: var(--δευτερεύον);
  padding: 2.5rem 0;
  margin: 0;
}

/* ---------- Footer ---------- */
.υποσέλιδο {
  text-align: center;
  padding: 3rem 0 2rem;
  font-size: 0.875rem;
  color: var(--δευτερεύον);
}
.υποσέλιδο a { color: var(--σύνδεσμος); }
.υποσέλιδο a:focus-visible,
.github-σύνδεσμος:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (max-width: 768px) {
  .κεφαλίδα { padding-top: 3.75rem; }
}

@media (prefers-reduced-motion: reduce) {
  .καρτέλα, .github-σύνδεσμος, #αναζήτηση { transition: none; }
  .καρτέλα:not(.απενεργοποιημένη):hover,
  .καρτέλα:not(.απενεργοποιημένη):focus-within { transform: none; }
}
</style>
</head>
<body>
<div class="περιέκτης">
  <header class="κεφαλίδα">
    <a class="github-σύνδεσμος" href="https://github.com/nick67" target="_blank" rel="noopener noreferrer" aria-label="Προφίλ στο GitHub (ανοίγει σε νέα καρτέλα)">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M9 2h5v5h-1.5V4.56L7.53 9.53 6.47 8.47l4.97-4.97H9V2ZM3.5 4A1.5 1.5 0 0 0 2 5.5v7A1.5 1.5 0 0 0 3.5 14h7a1.5 1.5 0 0 0 1.5-1.5V9h-1.5v3.5h-7v-7H7V4H3.5Z"/></svg>
      GitHub
    </a>
    <h1>Οι Εφαρμογές μου</h1>
    <p class="υπότιτλος">Μια συλλογή διαδραστικών εφαρμογών</p>
  </header>

  <main role="main">
    <div class="αναζήτηση-περιέκτης" role="search">
      <input type="search" id="αναζήτηση" placeholder="Αναζήτηση εφαρμογής…" aria-label="Αναζήτηση εφαρμογής" aria-controls="πλέγμα" autocomplete="off" spellcheck="false">
    </div>

    <div id="πλέγμα" class="πλέγμα">
      <article class="καρτέλα" data-id="physims" data-τιτλος="physims" data-περιγραφη="διαδραστικές προσομοιώσεις φυσικής για εκπαίδευση">
        <a class="περιεχόμενο-καρτέλας" href="https://github.com/nick67/simulations" target="_blank" rel="noopener noreferrer" aria-label="Άνοιγμα PhySims">
          <span class="εικονίδιο" aria-hidden="true">⚛️</span>
          <h2 class="τίτλος-καρτέλας">PhySims</h2>
          <p class="περιγραφή-καρτέλας">Διαδραστικές προσομοιώσεις φυσικής για εκπαίδευση</p>
        </a>
      </article>
    </div>

    <div id="αποτελέσματα" aria-live="polite">
      <p id="κανένα-αποτέλεσμα" class="μήνυμα-κενού" hidden>Δεν βρέθηκαν αποτελέσματα</p>
      <p id="πλήθος-αποτελεσμάτων" class="οπτικά-κρυφό"></p>
    </div>
  </main>

  <footer class="υποσέλιδο">
    <p>Τελευταία ενημέρωση: 20/11/2026 · <a href="https://github.com/nick67" target="_blank" rel="noopener noreferrer">GitHub</a></p>
  </footer>
</div>
<script>
(function () {
  'use strict';
  var πεδίο = document.getElementById('αναζήτηση');
  if (!πεδίο) { return; }
  var μήνυμαΚενού = document.getElementById('κανένα-αποτέλεσμα');
  var πλήθος = document.getElementById('πλήθος-αποτελεσμάτων');

  function κανονικοποίηση(κείμενο) {
    return (κείμενο || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/ς/g, 'σ');
  }

  var ευρετήριο = Array.prototype.map.call(
    document.querySelectorAll('#πλέγμα .καρτέλα'),
    function (καρτέλα) {
      return {
        στοιχείο: καρτέλα,
        κείμενο: κανονικοποίηση(
          καρτέλα.getAttribute('data-τιτλος') + ' ' + καρτέλα.getAttribute('data-περιγραφη')
        )
      };
    }
  );

  πεδίο.addEventListener('input', function () {
    var ερώτημα = κανονικοποίηση(πεδίο.value.trim());
    var ορατές = 0;
    for (var i = 0; i < ευρετήριο.length; i++) {
      var ταιριάζει = ερώτημα === '' || ευρετήριο[i].κείμενο.indexOf(ερώτημα) !== -1;
      ευρετήριο[i].στοιχείο.hidden = !ταιριάζει;
      if (ταιριάζει) { ορατές++; }
    }
    μήνυμαΚενού.hidden = ορατές !== 0;
    πλήθος.textContent = (ερώτημα === '' || ορατές === 0)
      ? ''
      : (ορατές === 1 ? 'Βρέθηκε 1 εφαρμογή' : 'Βρέθηκαν ' + ορατές + ' εφαρμογές');
  });
})();
</script>
</body>
</html>
